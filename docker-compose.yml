version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novamart-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongodb:27017/novamart
      - JWT_SECRET=dev_jwt_secret_key_change_in_production
    depends_on:
      - mongodb
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - novamart-network

  mongodb:
    image: mongo:6.0
    container_name: novamart-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=novamart
    volumes:
      - mongo-data:/data/db
    networks:
      - novamart-network

volumes:
  mongo-data:
  backend-uploads:

networks:
  novamart-network:
    driver: bridge
